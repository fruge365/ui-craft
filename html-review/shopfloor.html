<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d0a">
<title>铸线 · 产线综合监控墙</title>
<style>
:root{
  color-scheme:dark;
  --void:#0b0d0a;--deep:#101409;--panel:#12170f;--edge:#242c1c;--edge-2:#1b2216;
  --paper:#eef4e4;--mute:#8b9a78;--dim:#5f6d51;
  --amber:#ffb020;--lime:#b6e84a;--teal:#2fd6b0;--red:#ff5a45;--ice:#7fd8ff;
  font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--paper);font-synthesis:none;
  --mono:"Barlow Condensed","IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;
  background:
    radial-gradient(ellipse 60% 40% at 50% -12%,#2a3a14 0,transparent 62%),
    radial-gradient(ellipse 40% 30% at 8% 94%,#0f2a20 0,transparent 58%),
    var(--void)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 3px);opacity:.6}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%)}

.wall{position:relative;height:100vh;max-height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:clamp(6px,.9vh,12px);padding:clamp(8px,1.2vh,16px) clamp(12px,1.8vw,34px) clamp(6px,.9vh,12px);overflow:clip}

/* ── header ── */
.head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:clamp(6px,.9vh,11px);border-bottom:1px solid #222b1a;position:relative}
.head::after{content:"";position:absolute;left:0;bottom:-1px;width:34%;height:2px;background:linear-gradient(90deg,var(--amber),transparent)}
.left{display:flex;align-items:center;gap:clamp(9px,1.1vw,16px);min-width:0}
.emblem{width:clamp(30px,3.2vh,40px);aspect-ratio:1;flex:none;display:grid;place-items:center;border-radius:7px;
  background:linear-gradient(145deg,#ffc247,#e07b13);box-shadow:0 0 0 1px #ffffff1f,0 6px 20px #e07b1340}
.emblem svg{width:60%;height:60%}
.t h1{font-size:clamp(16px,2.3vh,26px);letter-spacing:.14em;font-weight:700;line-height:1.1;white-space:nowrap}
.t p{font-size:clamp(9px,1.2vh,11.5px);color:var(--dim);letter-spacing:.24em;margin-top:.45em;white-space:nowrap}
.wall-id{margin-left:clamp(8px,1vw,16px);padding-left:clamp(8px,1vw,16px);border-left:1px solid #2a341f;font-family:var(--mono);font-size:clamp(10px,1.4vh,13px);color:var(--mute);letter-spacing:.1em;white-space:nowrap}
.right{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px)}
.legend-mini{display:flex;gap:.85em;font-size:clamp(9px,1.16vh,11px);color:var(--mute);flex-wrap:wrap}
.legend-mini span{display:flex;align-items:center;gap:.35em;white-space:nowrap}
.legend-mini i{width:7px;height:7px;border-radius:2px}
.clock{text-align:right;line-height:1.3}
.clock b{display:block;font-family:var(--mono);font-size:clamp(17px,2.4vh,27px);letter-spacing:.04em;font-variant-numeric:tabular-nums;color:#f4fadf}
.clock small{display:block;font-size:clamp(9px,1.15vh,11px);color:var(--dim);letter-spacing:.08em;margin-top:.3em}

/* ── shift bar ── */
.shiftbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(5px,.6vw,9px)}
.cell{position:relative;border:1px solid var(--edge-2);border-radius:7px;padding:clamp(6px,.9vh,11px) clamp(7px,.8vw,12px);
  background:linear-gradient(172deg,#161d11,#0f1409 76%);overflow:hidden}
.cell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c,var(--amber))}
.cell .lb{font-size:clamp(8.5px,1.1vh,10.5px);letter-spacing:.1em;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .vr{display:flex;align-items:baseline;gap:.28em;margin-top:clamp(3px,.5vh,6px)}
.cell .vr b{font-family:var(--mono);font-size:clamp(19px,3.1vh,34px);font-weight:700;line-height:.92;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.cell .vr em{font-style:normal;font-size:clamp(9px,1.2vh,12px);color:var(--mute);font-weight:600}
.cell .sub2{font-size:clamp(8.5px,1.08vh,10px);color:var(--dim);letter-spacing:.03em;margin-top:.25em;display:flex;justify-content:space-between;gap:.4em;white-space:nowrap}
.cell .sub2 i{font-style:normal;color:var(--mute)}
.cell .prog{height:3px;border-radius:99px;background:#243016;margin-top:clamp(4px,.6vh,7px);overflow:hidden}
.cell .prog i{display:block;height:100%;background:var(--c,var(--amber));border-radius:99px}

/* ── grid ── */
.grid{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr) minmax(0,.92fr);gap:clamp(6px,.7vw,11px);min-height:0;overflow:hidden}
.col{display:grid;gap:clamp(6px,.7vw,11px);min-height:0;min-width:0}
.col-1{grid-template-rows:minmax(0,1.5fr) minmax(0,1fr)}
.col-2{grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.col-3{grid-template-rows:minmax(0,.95fr) minmax(0,1fr)}
.panel{position:relative;background:linear-gradient(174deg,#131a10f5,#0d1209f5);border:1px solid var(--edge);border-radius:9px;
  padding:clamp(7px,1vh,12px) clamp(8px,.9vw,13px);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:9px;padding-bottom:clamp(4px,.7vh,8px)}
.p-head h2{font-size:clamp(10px,1.3vh,12.5px);letter-spacing:.13em;font-weight:700;display:flex;align-items:center;gap:.5em;white-space:nowrap}
.p-head h2::before{content:"";width:2px;height:.92em;background:var(--amber)}
.p-head .meta{font-size:clamp(8.5px,1.08vh,10px);color:var(--dim);letter-spacing:.05em;white-space:nowrap}
.p-body{min-height:0;position:relative;overflow:hidden}

/* line diagram */
.line-diagram{height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.stations{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding-bottom:5px}
.stations span{font-size:clamp(8px,1.05vh,10px);color:var(--dim);text-align:center;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conveyor{position:relative;display:grid;place-items:center;min-height:0}
.conveyor svg{width:100%;height:100%}
/* alarm list */
.faults{display:grid;gap:clamp(3px,.5vh,6px);align-content:start;overflow:auto;scrollbar-width:none;min-height:0}
.fault{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(5px,.6vw,9px);align-items:center;
  padding:clamp(4px,.62vh,7px) clamp(5px,.5vw,8px);border-radius:5px;background:#121a0f;border:1px solid #1e2818;border-left:2px solid var(--lv,#ff5a45)}
.fault .dot2{width:5px;height:5px;border-radius:50%;background:var(--lv,#ff5a45)}
.fault .fx{min-width:0;font-size:clamp(9px,1.18vh,11px);line-height:1.35}
.fault .fx b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fault .fx small{display:block;color:var(--dim);margin-top:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fault .ft{font-family:var(--mono);font-size:clamp(8.5px,1.1vh,10.5px);color:var(--dim);font-variant-numeric:tabular-nums}

/* output bars */
.obars{display:grid;gap:clamp(5px,.75vh,9px);align-content:start;overflow:hidden}
.obar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(5px,.6vw,9px);align-items:center;font-size:clamp(9px,1.16vh,11px)}
.obar .lbl{color:var(--mute);white-space:nowrap;width:3.6em}
.obar .dual{display:grid;gap:2.5px}
.obar .dual i{display:block;height:5px;border-radius:99px;background:linear-gradient(90deg,#5c7f16,var(--lime))}
.obar .dual i.plan{background:#26301c}
.obar .pv{font-family:var(--mono);font-weight:650;font-variant-numeric:tabular-nums;text-align:right;color:#dceac0;font-size:1.12em;min-width:3.6em}
.obar .pv small{color:var(--dim);font-size:.8em;margin-left:.2em}

/* radar / polar */
.polar{height:100%;min-height:0}
.polar svg{width:100%;height:100%;display:block}

/* trend */
.minitrend{height:100%;min-height:0}
.minitrend svg{width:100%;height:100%;display:block}

/* oee block */
.oee{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(4px,.6vh,8px);align-content:start}
.oee-cell{display:grid;justify-items:center;gap:.2em}
.oee-cell svg{width:100%;max-width:64px;height:auto}
.oee-cell .v{font-family:var(--mono);font-size:clamp(12px,1.75vh,17px);font-weight:700;line-height:1}
.oee-cell .l{font-size:clamp(8px,1.02vh,9.5px);color:var(--dim);letter-spacing:.04em;text-align:center}

/* andon board */
.andon{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(4px,.55vh,7px);align-content:start}
.a-cell{display:grid;gap:3px;padding:clamp(4px,.6vh,7px) 5px;border-radius:5px;background:#111a0e;border:1px solid #1d2717;text-align:center}
.a-cell .nm3{font-size:clamp(8px,1.06vh,10px);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-cell .st2{font-size:clamp(9.5px,1.25vh,12px);font-weight:700;letter-spacing:.02em}
.a-cell .tm2{font-family:var(--mono);font-size:clamp(8.5px,1.1vh,10.5px);color:var(--dim);font-variant-numeric:tabular-nums}

/* spc chart */
.spc{height:100%;min-height:0}
.spc svg{width:100%;height:100%;display:block}

/* footer */
.ticker{display:flex;align-items:center;gap:12px;border-top:1px solid #1e2716;padding-top:clamp(4px,.7vh,8px);font-size:clamp(9px,1.14vh,11px);color:var(--dim);letter-spacing:.04em}
.ticker b{color:var(--amber);letter-spacing:.16em;font-weight:700;flex:none}
.tick-viewport{flex:1;min-width:0;overflow:clip;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.ticker .run{display:flex;gap:2.2em;white-space:nowrap;animation:slide 48s linear infinite}
.ticker .run span i{font-style:normal;color:#c6d6ac;font-family:var(--mono);margin-left:.3em}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker .run{animation:none}}

@media(max-width:1180px){
  .shiftbar{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid{grid-template-columns:1fr 1fr}
  .grid .col-3{grid-column:1/-1;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr}
}
@media(max-width:820px){
  body{height:auto;overflow:auto}
  .wall{height:auto;max-height:none}
  .grid{grid-template-columns:1fr}
  .grid .col-3{grid-template-columns:1fr}
  .shiftbar{grid-template-columns:1fr 1fr}
  .legend-mini{display:none}
  .wall-id{display:none}
}
</style>
</head>
<body data-review-context="line">
<main class="wall">
  <header class="head">
    <div class="left">
      <span class="emblem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#251503" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.5h13.5a3.5 3.5 0 0 0 0-7H8a3 3 0 0 1 0-6h6"/><circle cx="20.4" cy="17.4" r="1.7" fill="#251503" stroke="none"/></svg></span>
      <div class="t">
        <h1>铸线 · 产线综合监控</h1>
        <p>CASTING LINE · SHOP FLOOR WALL</p>
      </div>
      <span class="wall-id">二号铸造车间 / A 线</span>
    </div>
    <div class="right">
      <div class="legend-mini" aria-hidden="true">
        <span><i style="background:#b6e84a"></i>运行</span>
        <span><i style="background:#ffb020"></i>换模</span>
        <span><i style="background:#ff5a45"></i>停机</span>
        <span><i style="background:#5f6d51"></i>待料</span>
      </div>
      <div class="clock"><b id="clock">14:26:41</b><small id="shift">早班 · 距交班 1 小时 34 分</small></div>
    </div>
  </header>

  <section class="shiftbar" id="shiftbar" aria-label="本班生产指标"></section>

  <div class="grid">
    <div class="col col-1">
      <section class="panel" data-review-id="shop-line">
        <div class="p-head"><h2>产线实时状态</h2><span class="meta" id="lineState">7 工位 · 6 运行 1 停机</span></div>
        <div class="p-body">
          <div class="line-diagram">
            <div class="stations" id="stations"></div>
            <div class="conveyor" id="conveyor"></div>
          </div>
        </div>
      </section>
      <section class="panel" data-review-id="shop-faults">
        <div class="p-head"><h2>当前异常</h2><span class="meta" id="faultMeta">4 条</span></div>
        <div class="p-body"><div class="faults" id="faults"></div></div>
      </section>
    </div>

    <div class="col col-2">
      <section class="panel" data-review-id="shop-output">
        <div class="p-head"><h2>各班次产出</h2><span class="meta">实际 / 计划</span></div>
        <div class="p-body"><div class="obars" id="obars"></div></div>
      </section>
      <section class="panel" data-review-id="shop-oee">
        <div class="p-head"><h2>设备综合效率</h2><span class="meta">OEE 78.4%</span></div>
        <div class="p-body"><div class="oee" id="oee"></div></div>
      </section>
    </div>

    <div class="col col-3">
      <section class="panel" data-review-id="shop-andon">
        <div class="p-head"><h2>安灯看板</h2><span class="meta">近 8 小时</span></div>
        <div class="p-body"><div class="andon" id="andon"></div></div>
      </section>
      <section class="panel" data-review-id="shop-spc">
        <div class="p-head"><h2>壁厚控制图</h2><span class="meta">X̄ ±3σ</span></div>
        <div class="p-body"><div class="spc" id="spc"></div></div>
      </section>
    </div>
  </div>

  <footer class="ticker" data-review-id="shop-ticker">
    <b>产线播报</b>
    <div class="tick-viewport" data-overflow="clip" role="marquee" aria-label="产线播报滚动"><div class="run" id="ticker"></div></div>
  </footer>
</main>
<p class="sr" id="live" role="status" aria-live="polite"></p>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const stateColor = { run: '#b6e84a', setup: '#ffb020', down: '#ff5a45', wait: '#5f6d51' };
  const stateName = { run: '运行', setup: '换模', down: '停机', wait: '待料' };

  const stations = [
    { name: '熔炼', state: 'run', temp: 712, cyc: 42 },
    { name: '精炼', state: 'run', temp: 698, cyc: 38 },
    { name: '压铸', state: 'run', temp: 664, cyc: 51 },
    { name: '去毛刺', state: 'run', temp: 38, cyc: 33 },
    { name: '热处理', state: 'down', temp: 540, cyc: 0 },
    { name: '检测', state: 'run', temp: 33, cyc: 28 },
    { name: '包装', state: 'setup', temp: 31, cyc: 0 }
  ];

  const kpis = [
    ['当班产量', 1248, '件', '计划 1 380', 0.90, '#b6e84a'],
    ['良品率', 99.2, '%', '目标 ≥ 99.0', 0.99, '#2fd6b0'],
    ['节拍达成', 51, '秒', '标准 50 秒', 0.94, '#ffb020'],
    ['设备稼动率', 86.4, '%', '目标 ≥ 88%', 0.864, '#7fd8ff'],
    ['在制库存', 286, '件', '上限 320 件', 0.894, '#b6e84a']
  ];

  const faults = [
    { lv: '#ff5a45', name: '热处理炉 温区 3 超温', detail: '设定 540 ℃ · 实测 561 ℃ · 已自动降功率', time: '14:18' },
    { lv: '#ffb020', name: '包装工位换膜未完成', detail: '已耗时 12 分 · 标准 8 分', time: '14:14' },
    { lv: '#ffb020', name: '压铸模具寿命 92%', detail: '剩余 1 840 模次 · 建议本班末更换', time: '13:52' },
    { lv: '#5f6d51', name: '去毛刺砂带库存 2 卷', detail: '按当前消耗可支撑 6 小时', time: '13:30' }
  ];

  const output = [
    ['夜班', 1180, 1240], ['早班', 1248, 1380], ['中班', 0, 1320]
  ];

  const andon = [
    ['熔炼', '#b6e84a', '正常', '—'], ['精炼', '#b6e84a', '正常', '—'], ['压铸', '#ffb020', '注意', '13:52'],
    ['去毛刺', '#b6e84a', '正常', '—'], ['热处理', '#ff5a45', '异常', '14:18'], ['检测', '#b6e84a', '正常', '—'],
    ['包装', '#ffb020', '换模', '14:02'], ['物料', '#5f6d51', '低库存', '13:30'], ['公用', '#b6e84a', '正常', '—']
  ];

  function drawShiftbar() {
    $('shiftbar').innerHTML = kpis.map(([label, value, unit, note, ratio, color]) => `
      <article class="cell" style="--c:${color}">
        <p class="lb">${label}</p>
        <div class="vr"><b>${value}</b><em>${unit}</em></div>
        <p class="sub2"><span>${note}</span><i>${(ratio * 100).toFixed(0)}%</i></p>
        <div class="prog"><i style="width:${(ratio * 100).toFixed(1)}%"></i></div>
      </article>`).join('');
  }

  function drawLine() {
    $('stations').innerHTML = stations.map(s =>
      `<span style="color:${s.state === 'down' ? '#ff5a45' : s.state === 'setup' ? '#ffb020' : '#8b9a78'}">${s.name}</span>`).join('');
    const running = stations.filter(s => s.state === 'run').length;
    $('lineState').textContent = stations.length + ' 工位 · ' + running + ' 运行 ' +
      (stations.length - running) + ' 异常';

    const w = 700, h = 200;
    const slot = w / stations.length;
    const nodes = stations.map((s, i) => {
      const cx = slot * i + slot / 2;
      return { ...s, cx, cy: 100 };
    });
    const path = nodes.map((n, i) => {
      if (i === 0) return `M${(n.cx - slot / 2 + 6).toFixed(1)} 100 L${n.cx.toFixed(1)} 100`;
      return `L${n.cx.toFixed(1)} 100`;
    }).join(' ');
    const pulses = nodes.filter(n => n.state === 'run').map(n =>
      `<circle cx="${n.cx.toFixed(1)}" cy="100" r="3.2" fill="#b6e84a">
        <animate attributeName="cx" values="${(n.cx - slot / 2).toFixed(1)};${n.cx.toFixed(1)}" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.9;0" dur="1.6s" repeatCount="indefinite"/>
      </circle>`).join('');

    $('conveyor').innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="A 线七工位状态示意图，热处理停机、包装换模">
      <defs>
        <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#243016"></stop><stop offset=".5" stop-color="#3a4a24"></stop><stop offset="1" stop-color="#243016"></stop>
        </linearGradient>
        <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="6" stroke="#1a2312" stroke-width="2"></line>
        </pattern>
      </defs>
      <rect x="0" y="92" width="${w}" height="16" rx="8" fill="url(#railGrad)"></rect>
      <rect x="0" y="92" width="${w}" height="16" rx="8" fill="url(#hatch)" opacity=".55"></rect>
      ${nodes.map(n => `
        <g>
          <rect x="${(n.cx - 30).toFixed(1)}" y="34" width="60" height="46" rx="7" fill="#101708" stroke="${stateColor[n.state]}" stroke-width="1.5" opacity="${n.state === 'down' ? '.55' : '1'}"></rect>
          <text x="${n.cx.toFixed(1)}" y="54" fill="#dceac0" font-size="12.5" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600">${n.name}</text>
          <text x="${n.cx.toFixed(1)}" y="70" fill="${stateColor[n.state]}" font-size="11" text-anchor="middle" font-family="Barlow Condensed,monospace" letter-spacing=".06em">${stateName[n.state]}</text>
          <rect x="${(n.cx - 30).toFixed(1)}" y="84" width="60" height="3" fill="${stateColor[n.state]}" opacity=".5"></rect>
          <text x="${n.cx.toFixed(1)}" y="118" fill="#7d8b6a" font-size="10.5" text-anchor="middle" font-family="Barlow Condensed,monospace">${n.temp} ℃</text>
          <text x="${n.cx.toFixed(1)}" y="132" fill="#5f6d51" font-size="10" text-anchor="middle" font-family="Barlow Condensed,monospace">${n.cyc ? n.cyc + ' s' : '停'}</text>
          ${n.state === 'down' ? '<g stroke="#ff5a45" stroke-width="1.4"><path d="M-6 -6 L6 6 M6 -6 L-6 6" transform="translate(' + (n.cx + 22).toFixed(1) + ',28)"/></g>' : ''}
        </g>`).join('')}
      <path d="${path}" stroke="#3a4a24" stroke-width="1.4" fill="none"></path>
      ${pulses}
      <text x="6" y="190" fill="#4d5943" font-size="9.5" font-family="Barlow Condensed,monospace">进料 →</text>
      <text x="${w - 6}" y="190" fill="#4d5943" font-size="9.5" text-anchor="end" font-family="Barlow Condensed,monospace">→ 成品</text>
    </svg>`;
  }

  function drawFaults() {
    $('faultMeta').textContent = faults.length + ' 条';
    $('faults').innerHTML = faults.map(f => `
      <article class="fault" style="--lv:${f.lv}">
        <span class="dot2" aria-hidden="true"></span>
        <span class="fx"><b>${f.name}</b><small>${f.detail}</small></span>
        <span class="ft">${f.time}</span>
      </article>`).join('');
  }

  function drawOutput() {
    $('obars').innerHTML = output.map(([shift, actual, plan]) => {
      const a = plan ? actual / plan : 0;
      const p = 1;
      return `<div class="obar">
        <span class="lbl">${shift}</span>
        <span class="dual">
          <i style="width:${(p * 100).toFixed(0)}%" class="plan" aria-hidden="true"></i>
          <i style="width:${(a * 100).toFixed(1)}%" aria-hidden="true"></i>
        </span>
        <span class="pv">${actual.toLocaleString('zh-CN')}<small>/ ${plan.toLocaleString('zh-CN')}</small></span>
      </div>`;
    }).join('');
  }

  function drawOee() {
    const parts = [['可用率', 90.2], ['性能率', 94.6], ['合格率', 99.2], ['OEE', 78.4]];
    $('oee').innerHTML = parts.map(([label, value]) => {
      const ratio = Math.min(1, value / 100);
      const dash = 226.2;
      const color = value >= 85 ? '#b6e84a' : value >= 78 ? '#ffb020' : '#ff5a45';
      return `<div class="oee-cell">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="36" fill="none" stroke="#243016" stroke-width="11"></circle>
          <circle cx="50" cy="50" r="36" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="butt"
            stroke-dasharray="${dash}" stroke-dashoffset="${(dash * (1 - ratio)).toFixed(1)}" transform="rotate(-90 50 50)"></circle>
        </svg>
        <b class="v" style="color:${color}">${value}<span style="font-size:.62em;color:#8b9a78">%</span></b>
        <span class="l">${label}</span>
      </div>`;
    }).join('');
  }

  function drawAndon() {
    $('andon').innerHTML = andon.map(([name, color, state, time]) => `
      <div class="a-cell">
        <span class="nm3">${name}</span>
        <span class="st2" style="color:${color}">${state}</span>
        <span class="tm2">${time}</span>
      </div>`).join('');
  }

  function drawSpc() {
    // A control chart, not a decorative wave: mean line, ±3σ limits, and the one
    // point that breached them.
    const values = [11.8, 12.1, 11.9, 12.0, 11.7, 12.2, 12.0, 11.9, 12.1, 11.8, 12.3, 12.0, 11.9, 12.1, 12.6, 12.0, 11.8, 11.9];
    const mean = 12.0, sigma = 0.22;
    const w = 300, h = 120, padY = 12;
    const min = mean - sigma * 4, max = mean + sigma * 4;
    const y = v => h - padY - (v - min) / (max - min) * (h - padY * 2);
    const x = i => 10 + i * (w - 20) / (values.length - 1);
    const line = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const ucl = y(mean + sigma * 3), lcl = y(mean - sigma * 3), cl = y(mean);
    $('spc').innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="壁厚控制图，第 15 点超出上限">
      <rect x="0" y="${ucl.toFixed(1)}" width="${w}" height="${(lcl - ucl).toFixed(1)}" fill="#b6e84a" opacity=".05"></rect>
      <line x1="0" y1="${ucl.toFixed(1)}" x2="${w}" y2="${ucl.toFixed(1)}" stroke="#ff5a45" stroke-width=".7" stroke-dasharray="4 3" opacity=".8"></line>
      <line x1="0" y1="${cl.toFixed(1)}" x2="${w}" y2="${cl.toFixed(1)}" stroke="#5f6d51" stroke-width=".7"></line>
      <line x1="0" y1="${lcl.toFixed(1)}" x2="${w}" y2="${lcl.toFixed(1)}" stroke="#ff5a45" stroke-width=".7" stroke-dasharray="4 3" opacity=".8"></line>
      <text x="3" y="${(ucl - 3).toFixed(1)}" fill="#ff5a45" font-size="7.4" font-family="Barlow Condensed,monospace">UCL 12.66</text>
      <text x="3" y="${(lcl + 9).toFixed(1)}" fill="#ff5a45" font-size="7.4" font-family="Barlow Condensed,monospace">LCL 11.34</text>
      <polyline points="${line}" fill="none" stroke="#7fd8ff" stroke-width="1.5" stroke-linejoin="round"></polyline>
      ${values.map((v, i) => {
        const breach = Math.abs(v - mean) > sigma * 3;
        return `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${breach ? 3 : 1.9}" fill="${breach ? '#ff5a45' : '#7fd8ff'}"></circle>`;
      }).join('')}
    </svg>`;
  }

  function drawTicker() {
    const items = ['早班产量', '1 248 / 1 380 件', '良品率', '99.2%', '热处理炉温区 3 超温', '已降功率处理',
      '压铸模具剩余', '1 840 模次', '去毛刺砂带', '可支撑 6 小时', '包装换膜耗时', '12 分'];
    const row = items.map((t, i) => i % 2 === 0 ? `<span>${t}<i>${items[i + 1]}</i></span>` : '').filter(Boolean).join('');
    $('ticker').innerHTML = row + row;
    $('live').textContent = '早班产量 1 248 件，良品率 99.2%，4 条异常待处理，其中热处理炉温区 3 超温已自动降功率。';
  }

  const pad = n => String(n).padStart(2, '0');
  function tick() {
    const now = new Date();
    $('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    const left = 16 * 60 - (now.getHours() * 60 + now.getMinutes());
    $('shift').textContent = '早班 · 距交班 ' + Math.floor(left / 60) + ' 小时 ' + (left % 60) + ' 分';
  }

  drawShiftbar(); drawLine(); drawFaults(); drawOutput(); drawOee(); drawAndon(); drawSpc(); drawTicker();
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
