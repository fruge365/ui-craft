<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050a14">
<title>衡远 · 集团经营驾驶舱</title>
<style>
:root{
  color-scheme:dark;
  --void:#050a14;--deep:#071026;--panel:#0a1428;--panel-2:#0d1a33;--edge:#16294a;
  --paper:#e8f1ff;--mute:#7e94b4;--dim:#54688a;
  --azure:#3f7cff;--cyan:#2ee6e0;--gold:#f5c451;--coral:#ff6b5e;--lime:#7bdc80;--violet:#9d7bff;
  font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--paper);font-synthesis:none;
  --mono:"Barlow Condensed","IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;height:100vh;overflow:hidden;
  background:
    radial-gradient(ellipse 70% 46% at 50% -10%,#12295a 0,transparent 62%),
    radial-gradient(ellipse 46% 34% at 6% 78%,#0b2a3a 0,transparent 60%),
    radial-gradient(ellipse 40% 30% at 96% 22%,#1c1640 0,transparent 58%),
    var(--void);
  overflow-x:hidden;
}
/* A faint engineering grid keeps the wall from reading as a poster. */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 20%,transparent 78%)}
h1,h2,h3,h4,p,dl,dd{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%)}

.wall{position:relative;z-index:1;height:100vh;max-height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);padding:clamp(8px,1.2vh,16px) clamp(14px,2vw,40px) clamp(6px,.9vh,12px);gap:clamp(6px,.9vh,13px);overflow:clip}

/* ── Header ─────────────────────────────────────── */
.head{display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative}
.head::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,#2ee6e055 20%,#3f7cff66 50%,#2ee6e055 80%,transparent)}
.brandzone{display:flex;align-items:center;gap:clamp(10px,1.2vw,18px);padding-bottom:clamp(8px,1.2vh,14px);min-width:0}
.crest{width:clamp(34px,3.4vh,46px);aspect-ratio:1;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,#2ee6e0,#2f6bff 55%,#6b3bff);box-shadow:0 0 0 1px #ffffff26,0 8px 26px #2f6bff40}
.crest svg{width:56%;height:56%}
.title h1{font-size:clamp(18px,2.5vh,30px);letter-spacing:.16em;font-weight:750;line-height:1.1;white-space:nowrap}
.title p{font-size:clamp(10px,1.35vh,13px);color:var(--mute);letter-spacing:.28em;margin-top:.5em;white-space:nowrap}
.headmid{flex:1;display:flex;justify-content:center;min-width:0}
.scope-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.scope-pills button{padding:.42em .8em;border-radius:6px;border:1px solid var(--edge);background:#081226;color:var(--mute);font-size:clamp(10px,1.25vh,12.5px);font-weight:650;letter-spacing:.04em;transition:.15s}
.scope-pills button:hover{color:var(--paper);border-color:#2b4670}
.scope-pills button[aria-pressed=true]{background:linear-gradient(#1b3f7d,#12234a);border-color:#3f7cff88;color:#cfe2ff;box-shadow:0 0 0 1px #3f7cff33,0 4px 14px #3f7cff26}
.headright{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);padding-bottom:clamp(8px,1.2vh,14px)}
.stamp{text-align:right;line-height:1.35}
.stamp b{display:block;font-family:var(--mono);font-size:clamp(19px,2.6vh,30px);letter-spacing:.04em;font-variant-numeric:tabular-nums;color:#dbe9ff}
.stamp small{display:block;font-size:clamp(9px,1.2vh,11.5px);color:var(--dim);letter-spacing:.1em;margin-top:.35em}
.live{display:flex;align-items:center;gap:7px;font-size:clamp(9px,1.2vh,11.5px);color:var(--lime);letter-spacing:.1em;font-weight:650;padding:.4em .7em;border:1px solid #2c6a3e;background:#08220f;border-radius:99px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px #7bdc8029;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── KPI band ───────────────────────────────────── */
.band{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,.7vw,10px);min-width:0}
.metric{position:relative;padding:clamp(8px,1.2vh,14px) clamp(9px,1vw,15px) clamp(10px,1.4vh,16px);border-radius:9px;
  background:linear-gradient(168deg,#0e1d38,#081226 74%);border:1px solid var(--edge);overflow:hidden}
.metric::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent,var(--azure));box-shadow:0 0 12px var(--accent,var(--azure))}
.metric::after{content:"";position:absolute;inset:0 0 auto;height:52px;
  background:radial-gradient(ellipse 120% 100% at 12% -34%,var(--accent,var(--azure))26,transparent 70%);pointer-events:none}
.m-label{font-size:clamp(9px,1.16vh,11.5px);letter-spacing:.1em;color:var(--mute);font-weight:600;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:clamp(4px,.7vh,9px);position:relative}
.m-val{font-family:var(--mono);font-size:clamp(22px,3.6vh,40px);font-weight:700;line-height:.94;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.m-val em{font-style:normal;font-size:.4em;font-weight:600;color:var(--mute);margin-left:.25em;letter-spacing:.04em}
.m-delta{font-family:var(--mono);font-size:clamp(10px,1.4vh,13px);font-weight:650;padding:.15em .35em;border-radius:3px;white-space:nowrap}
.m-delta.up{color:#ffd08a;background:#4a3111}
.m-delta.down{color:#a5e8a9;background:#0e2f17}
.m-delta.flat{color:var(--dim);background:#101c30}
.m-spark{display:block;width:calc(100% + 2px);height:clamp(16px,2.6vh,28px);margin:clamp(5px,.8vh,9px) -1px 0}

/* ── Main grid ──────────────────────────────────── */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.28fr) minmax(0,1fr);gap:clamp(6px,.7vw,11px);min-height:0;min-width:0;overflow:hidden}
.col{display:grid;gap:clamp(6px,.7vw,11px);min-height:0;min-width:0;align-content:stretch;grid-template-rows:1fr}
.col:nth-child(1){grid-template-rows:minmax(0,1.45fr) minmax(0,1fr)}
.col:nth-child(2){grid-template-rows:minmax(0,1.25fr) minmax(0,.85fr) minmax(0,.9fr)}
.col:nth-child(3){grid-template-rows:minmax(0,1.15fr) minmax(0,1fr)}
.panel{position:relative;background:linear-gradient(176deg,#0b1730f2,#070f20f2);border:1px solid var(--edge);border-radius:10px;padding:clamp(7px,1vh,12px) clamp(9px,1vw,13px);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden}
.panel::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,#2ee6e066,#3f7cff55,transparent)}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:clamp(5px,.8vh,9px)}
.p-head h2{font-size:clamp(10.5px,1.35vh,13.5px);letter-spacing:.14em;font-weight:700;display:flex;align-items:center;gap:.55em;white-space:nowrap}
.p-head h2::before{content:"";width:3px;height:.95em;border-radius:1px;background:linear-gradient(var(--cyan),var(--azure))}
.p-head .unit{font-size:clamp(8.5px,1.1vh,10.5px);color:var(--dim);letter-spacing:.06em;white-space:nowrap}
.p-body{min-height:0;position:relative}

/* map */
.mapwrap{position:relative;border-radius:7px;overflow:hidden;background:radial-gradient(ellipse 74% 70% at 52% 46%,#0e2545,#061020 78%);height:100%;min-height:0}
.mapwrap svg{width:100%;height:100%;display:block}
.map-legend{position:absolute;left:8px;bottom:8px;display:grid;gap:4px;font-size:clamp(8px,1.05vh,10px);color:var(--mute);letter-spacing:.04em}
.map-legend span{display:flex;align-items:center;gap:5px}
.map-legend i{width:6px;height:6px;border-radius:50%}
.map-tip{position:absolute;right:8px;top:8px;padding:.35em .6em;border-radius:5px;background:#040a14e0;border:1px solid var(--edge);font-size:clamp(9px,1.15vh,11px);color:#b9cde8;line-height:1.5;text-align:right}
.map-tip b{color:var(--gold);font-family:var(--mono);font-size:1.18em}

/* bars list */
.rank{display:grid;gap:clamp(5px,.85vh,9px);align-content:start}
.rank-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(6px,.7vw,11px);align-items:center;font-size:clamp(9.5px,1.24vh,12px)}
.rank-row .rk{font-family:var(--mono);color:var(--dim);font-size:1.05em;width:1.5em}
.rank-row .nm{display:grid;gap:3px;min-width:0}
.rank-row .nm b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.track{height:4px;border-radius:99px;background:#12213a;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--azure));box-shadow:0 0 8px #3f7cff66}
.rank-row .vl{font-family:var(--mono);font-size:1.1em;font-weight:650;text-align:right;font-variant-numeric:tabular-nums;color:#cfe0f7}
.rank-row .vl small{font-size:.74em;color:var(--dim);margin-left:.2em;font-weight:500}

/* gauge cluster */
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,.7vw,11px);align-content:start}
.gauge{display:grid;justify-items:center;gap:.35em;padding:clamp(4px,.6vh,8px) 2px}
.gauge svg{width:100%;max-width:78px;height:auto}
.gauge .g-val{font-family:var(--mono);font-size:clamp(13px,1.9vh,19px);font-weight:700;line-height:1;margin-top:-.55em;font-variant-numeric:tabular-nums}
.gauge .g-label{font-size:clamp(8.5px,1.1vh,10.5px);color:var(--mute);letter-spacing:.06em;text-align:center;line-height:1.35}

/* trend chart */
.trend{position:relative;height:100%;min-height:0;min-width:0}
.trend svg{width:100%;height:100%;display:block;overflow:visible}
.trend-legend{display:flex;gap:.9em;font-size:clamp(8.5px,1.05vh,10px);color:var(--mute);align-items:center;flex-wrap:wrap}
.trend-legend span{display:flex;align-items:center;gap:.35em}
.trend-legend i{width:9px;height:2px;border-radius:1px}

/* alerts */
.alerts{display:grid;gap:clamp(4px,.6vh,7px);align-content:start;overflow:auto;scrollbar-width:none;min-height:0}
.alerts::-webkit-scrollbar{display:none}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(6px,.7vw,10px);align-items:center;
  padding:clamp(5px,.75vh,8px) clamp(6px,.6vw,9px);border-radius:6px;background:#0c1a30;border:1px solid #16294a;border-left:2px solid var(--lvl,#f5c451)}
.alert .ic{width:clamp(16px,2.1vh,21px);aspect-ratio:1;border-radius:5px;display:grid;place-items:center;background:color-mix(in srgb,var(--lvl,#f5c451) 16%,transparent);color:var(--lvl,#f5c451)}
.alert .ic svg{width:64%;height:64%}
.alert .tx{min-width:0;font-size:clamp(9.5px,1.22vh,11.5px);line-height:1.4}
.alert .tx b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert .tx small{display:block;color:var(--dim);margin-top:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert .tm{font-family:var(--mono);font-size:clamp(9px,1.15vh,11px);color:var(--dim);font-variant-numeric:tabular-nums}

/* waterfall / funnel */
.funnel{display:grid;gap:clamp(4px,.65vh,7px);align-content:start}
.fn-row{display:grid;grid-template-columns:auto 1fr auto;gap:clamp(5px,.6vw,9px);align-items:center;font-size:clamp(9px,1.18vh,11px)}
.fn-row .lb{color:var(--mute);white-space:nowrap;letter-spacing:.03em}
.fn-bar{height:clamp(11px,1.5vh,15px);border-radius:3px;background:linear-gradient(90deg,#1c4ea8,#2ee6e0);position:relative;box-shadow:0 0 10px #2ee6e033}
.fn-row .pv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650;color:#cfe0f7}
.fn-note{font-size:clamp(8.5px,1.05vh,10px);color:var(--dim);letter-spacing:.03em;line-height:1.5;margin-top:2px}

/* table of segments */
.seg-table{display:grid;gap:0;font-size:clamp(9px,1.18vh,11px);align-content:start;overflow:auto;scrollbar-width:none;min-height:0}
.seg-table .sr-row{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,.8fr));gap:4px;align-items:center;
  padding:clamp(4px,.62vh,7px) 2px;border-bottom:1px solid #122036}
.seg-table .sr-row.hd{color:var(--dim);font-size:.92em;letter-spacing:.06em;border-bottom-color:#1a2c48;padding-bottom:.35em}
.seg-table .sr-row .nm2{display:flex;align-items:center;gap:.5em;min-width:0}
.seg-table .sr-row .nm2 i{width:5px;height:5px;border-radius:1px;flex:none}
.seg-table .sr-row .nm2 b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-table .sr-row>span:not(.nm2){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:#c6d8ee}
.seg-table .sr-row .neg{color:var(--coral)}
.seg-table .sr-row .pos{color:var(--lime)}

/* ── Footer ticker ──────────────────────────────── */
.ticker{display:flex;align-items:center;gap:14px;border-top:1px solid #14233c;padding-top:clamp(5px,.8vh,9px);font-size:clamp(9px,1.15vh,11px);color:var(--dim);letter-spacing:.04em}
.tick-viewport{flex:1;min-width:0;overflow:clip;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker b{color:var(--cyan);letter-spacing:.16em;font-weight:700;flex:none;font-size:.95em}
.ticker .run{display:flex;gap:2.4em;white-space:nowrap;animation:slide 42s linear infinite}
.ticker .run span i{font-style:normal;color:#b9cde8;font-family:var(--mono);margin-left:.3em}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker .run{animation:none}.live i{animation:none}}

@media(max-width:1200px){
  .band{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid{grid-template-columns:1fr 1fr}
  .grid .col:nth-child(3){grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:860px){
  .grid{grid-template-columns:1fr}
  .grid .col:nth-child(3){grid-template-columns:1fr}
  .headmid{display:none}
  .wall{padding:10px 12px}
  .band{grid-template-columns:1fr 1fr}
  .title h1{font-size:15px;letter-spacing:.1em}
  .title p{font-size:9px;letter-spacing:.16em}
}
</style>
</head>
<body data-review-context="group">
<main class="wall">
  <header class="head">
    <div class="brandzone">
      <span class="crest" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#050d1a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20h18M5.5 20V9l6-5 6 5v11"/><path d="M9.5 20v-5.5h4V20"/>
        </svg>
      </span>
      <div class="title">
        <h1>衡远控股 · 经营驾驶舱</h1>
        <p>GROUP OPERATIONS COCKPIT</p>
      </div>
    </div>
    <div class="headmid">
      <div class="scope-pills" role="group" aria-label="统计范围">
        <button type="button" data-scope="group" aria-pressed="true" data-review-id="cockpit-scope-group">集团合并</button>
        <button type="button" data-scope="east" aria-pressed="false" data-review-id="cockpit-scope-east">华东区</button>
        <button type="button" data-scope="south" aria-pressed="false" data-review-id="cockpit-scope-south">华南区</button>
        <button type="button" data-scope="north" aria-pressed="false" data-review-id="cockpit-scope-north">华北区</button>
      </div>
    </div>
    <div class="headright">
      <span class="live"><i aria-hidden="true"></i>实时</span>
      <div class="stamp"><b id="clock">14:26:41</b><small id="datestamp">2026.11.17 周二 · 数据延迟 38 秒</small></div>
    </div>
  </header>

  <section class="band" id="band" aria-label="关键经营指标"></section>

  <div class="grid">
    <div class="col">
      <section class="panel" style="grid-row:span 2" data-review-id="cockpit-map">
        <div class="p-head"><h2>区域营收分布</h2><span class="unit">单位：万元</span></div>
        <div class="p-body">
          <div class="mapwrap">
            <svg viewBox="0 0 300 210" role="img" aria-label="区域营收气泡分布示意">
              <defs>
                <radialGradient id="bub"><stop offset="0" stop-color="#2ee6e0" stop-opacity=".55"></stop><stop offset="1" stop-color="#2ee6e0" stop-opacity="0"></stop></radialGradient>
                <filter id="glow"><feGaussianBlur stdDeviation="2.6" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
              </defs>
              <g stroke="#22406b" fill="none" stroke-width=".6" opacity=".7">
                <path d="M22 48 L96 30 L150 44 L206 32 L268 58 L282 118 L246 168 L176 182 L112 172 L58 148 L26 100 Z"></path>
                <path d="M56 74 L124 66 L170 86 L212 74 L242 112 L206 150 L148 158 L92 140 L62 112 Z" opacity=".65"></path>
                <path d="M96 30 L112 100 L92 140 M150 44 L170 86 L148 158 M206 32 L212 74 L206 150" opacity=".5"></path>
              </g>
              <g id="bubbles"></g>
            </svg>
            <div class="map-tip">华东 <b>42.8%</b><br>最高单区域占比</div>
            <div class="map-legend">
              <span><i style="background:#2ee6e0"></i>营收规模</span>
              <span><i style="background:#f5c451"></i>同比正增长</span>
              <span><i style="background:#ff6b5e"></i>同比下滑</span>
            </div>
          </div>
        </div>
      </section>
      <section class="panel">
        <div class="p-head" data-review-id="cockpit-rank"><h2>业务板块增速</h2><span class="unit">同比 %</span></div>
        <div class="p-body"><div class="rank" id="rank"></div></div>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <div class="p-head" data-review-id="cockpit-trend"><h2>近 12 月营收与毛利</h2>
          <span class="trend-legend"><span><i style="background:#3f7cff"></i>营收</span><span><i style="background:#2ee6e0"></i>毛利</span></span>
        </div>
        <div class="p-body"><div class="trend" id="trend"></div></div>
      </section>
      <section class="panel">
        <div class="p-head" data-review-id="cockpit-gauges"><h2>核心效率指标</h2><span class="unit">目标 / 实际</span></div>
        <div class="p-body"><div class="gauges" id="gauges"></div></div>
      </section>
      <section class="panel">
        <div class="p-head" data-review-id="cockpit-funnel"><h2>经营漏斗</h2><span class="unit">本期累计</span></div>
        <div class="p-body">
          <div class="funnel" id="funnel"></div>
          <p class="fn-note" id="funnelNote">线索到回款的整体转化 18.4%，低于集团 22% 的目标线 3.6 个百分点。</p>
        </div>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <div class="p-head" data-review-id="cockpit-alerts"><h2>异常与待办</h2><span class="unit" id="alertCount">6 条</span></div>
        <div class="p-body"><div class="alerts" id="alerts"></div></div>
      </section>
      <section class="panel">
        <div class="p-head" data-review-id="cockpit-seg"><h2>板块经营明细</h2><span class="unit">营收 / 毛利率 / 同比</span></div>
        <div class="p-body"><div class="seg-table" id="segTable"></div></div>
      </section>
    </div>
  </div>

  <footer class="ticker" data-review-id="cockpit-ticker">
    <b>集团快讯</b>
    <div class="tick-viewport" data-overflow="clip" role="marquee" aria-label="集团快讯滚动播报"><div class="run" id="ticker"></div></div>
  </footer>
</main>

    const max = Math.max(...values), min = Math.min(...values);

      const x = pad + i * (w - pad * 2) / (values.length - 1);
      const y = h - pad - (v - min) / span * (h - pad * 2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    const id = 'sg' + Math.random().toString(36).slice(2, 8);
    return `<svg class="m-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">

  }

      return `<g filter="url(#glow)">

      </g>`;
    }).join('');
  }

      .map(([name, , , yoy], i) => {
        const value = parseFloat(yoy);
        const width = Math.abs(value) / max * 100;
        const color = value >= 0 ? 'linear-gradient(90deg,#2ee6e0,#3f7cff)' : 'linear-gradient(90deg,#ff6b5e,#c2402a)';
        return `<div class="rank-row">
          <span class="rk">${String(i + 1).padStart(2, '0')}</span>

          <span class="vl" style="color:${value >= 0 ? '#a5e8a9' : '#ff9a90'}">${yoy}<small>%</small></span>
        </div>`;
      }).join('');
  }

    const max = Math.max(...revenue) * 1.12;
    const x = i => (i / (months.length - 1)) * w;
    const y = v => h - (v / max) * h;
    const line = arr => arr.map((v, i) => `${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');

      </defs>
      ${[0.25, 0.5, 0.75].map(r => `<line x1="0" y1="${(h * r).toFixed(1)}" x2="${w}" y2="${(h * r).toFixed(1)}" stroke="#16294a" stroke-width=".35"></line>`).join('')}
      <path d="${area(revenue)}" fill="url(#revFill)"></path>
      <path d="${area(gross)}" fill="url(#grossFill)"></path>
      <polyline points="${line(revenue)}" fill="none" stroke="#3f7cff" stroke-width="1.1" stroke-linejoin="round"></polyline>
      <polyline points="${line(gross)}" fill="none" stroke="#2ee6e0" stroke-width="1.1" stroke-linejoin="round"></polyline>
      <circle cx="${x(11)}" cy="${y(revenue[11])}" r="1.1" fill="#3f7cff"></circle>
      <circle cx="${x(11)}" cy="${y(gross[11])}" r="1.1" fill="#2ee6e0"></circle>
    </svg>`;
  }

  function drawGauges(data) {
    $('gauges').innerHTML = data.gauges.map(([label, actual, target, unit]) => {
      const ratio = Math.min(1, actual / target);

      return `<div class="gauge">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="40" fill="none" stroke="#12213a" stroke-width="9"></circle>
          <circle cx="50" cy="50" r="40" fill="none" stroke="${good}" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="${dash}" stroke-dashoffset="${(dash * (1 - ratio)).toFixed(1)}" transform="rotate(-90 50 50)"></circle>
        </svg>
        <b class="g-val" style="color:${good}">${actual}<span style="font-size:.55em;color:#7e94b4">${unit}</span></b>
        <span class="g-label">${label}<br>目标 ${target}${unit}</span>
      </div>`;
    }).join('');
  }

  const pad = n => String(n).padStart(2, '0');
  const week = ['日', '一', '二', '三', '四', '五', '六'];
